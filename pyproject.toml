[project]
name = "running-dashboard-import"
version = "0.1.0"
description = "Import activity exports for the running dashboard"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
